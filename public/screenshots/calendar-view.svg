    <text x="382" y="21" font-family="sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="middle">ÇARŞAMBA</text>
    <text x="535" y="21" font-family="sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="middle">PERŞEMBE</text>
    <text x="688" y="21" font-family="sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="middle">CUMA</text>
