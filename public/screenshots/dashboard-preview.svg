      <text x="40" y="15" font-family="sans-serif" font-weight="600" font-size="12" fill="#f8fafc">Ahmet Yılmaz</text>
      <text x="40" y="27" font-family="sans-serif" font-size="10" fill="#34d399">● Aktif Oturum</text>
