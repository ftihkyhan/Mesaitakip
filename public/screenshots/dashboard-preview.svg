<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-grad)" />

  <!-- Window Header / Browser Mockup Bar -->
  <rect x="40" y="30" width="1120" height="620" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="40" y="30" width="1120" height="42" rx="16" fill="#1e293b" />
  <rect x="40" y="60" width="1120" height="12" fill="#1e293b" />
  <circle cx="68" cy="51" r="6" fill="#ef4444" />
  <circle cx="88" cy="51" r="6" fill="#f59e0b" />
  <circle cx="108" cy="51" r="6" fill="#10b981" />

  <!-- URL Bar -->
