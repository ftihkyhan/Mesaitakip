    <text x="32" y="184" font-family="sans-serif" font-weight="700" font-size="11" fill="#38bdf8">⚖️ 4857 Sayılı Kanun Madde 41 &amp; 47</text>
    <text x="32" y="204" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Haftalık 45 saati aşan çalışmalar için saatlik</text>
    <text x="32" y="220" font-family="sans-serif" font-size="10.5" fill="#94a3b8">ücret <tspan fill="#34d399" font-weight="700">%50 fazlasıyla (1.5x)</tspan> ödenir.</text>
    <text x="32" y="242" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Resmi tatil günlerinde ise <tspan fill="#fbbf24" font-weight="700">%100 zamlı (2.0x)</tspan></text>
    <text x="32" y="258" font-family="sans-serif" font-size="10.5" fill="#94a3b8">tam gün gündelik ödenir.</text>
