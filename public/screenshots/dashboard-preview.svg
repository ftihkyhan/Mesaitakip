      <text x="534" y="25" font-family="sans-serif" font-weight="700" font-size="12" fill="#34d399">₺ 1.080,00</text>
      <text x="640" y="25" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="end">Düzenle</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(16, 184)">
      <rect x="0" y="0" width="668" height="42" rx="6" fill="#0f172a" />
      <text x="16" y="25" font-family="sans-serif" font-weight="600" font-size="12" fill="#ffffff">18 Ekim 2026</text>
      <text x="124" y="25" font-family="sans-serif" font-size="12" fill="#cbd5e1">10:00 - 16:30</text>
      <rect x="250" y="10" width="130" height="22" rx="4" fill="#3730a3" fill-opacity="0.3" stroke="#818cf8" stroke-width="0.5" />
      <text x="315" y="25" font-family="sans-serif" font-size="10" font-weight="600" fill="#c7d2fe" text-anchor="middle">Hafta Sonu Mesai (1.5x)</text>
      <text x="424" y="25" font-family="sans-serif" font-size="12" fill="#cbd5e1">6.0 Saat</text>
      <text x="534" y="25" font-family="sans-serif" font-weight="700" font-size="12" fill="#34d399">₺ 1.620,00</text>
      <text x="640" y="25" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="end">Düzenle</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(16, 232)">
      <rect x="0" y="0" width="668" height="42" rx="6" fill="#0f172a" />
      <text x="16" y="25" font-family="sans-serif" font-weight="600" font-size="12" fill="#ffffff">12 Ekim 2026</text>
      <text x="124" y="25" font-family="sans-serif" font-size="12" fill="#cbd5e1">18:00 - 21:00</text>
      <rect x="250" y="10" width="130" height="22" rx="4" fill="#312e81" fill-opacity="0.4" stroke="#6366f1" stroke-width="0.5" />
      <text x="315" y="25" font-family="sans-serif" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">Hafta İçi Mesai (1.5x)</text>
      <text x="424" y="25" font-family="sans-serif" font-size="12" fill="#cbd5e1">3.0 Saat</text>
      <text x="534" y="25" font-family="sans-serif" font-weight="700" font-size="12" fill="#34d399">₺ 810,00</text>
      <text x="640" y="25" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="end">Düzenle</text>
    </g>
