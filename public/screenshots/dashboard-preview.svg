  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">https://mesaitakip.app/ekim-2026/dashboard</text>

  <!-- App Header -->
  <g transform="translate(64, 90)">
