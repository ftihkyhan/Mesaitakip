    <text x="18" y="24" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">M</text>
    <text x="46" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f8fafc">MesaiTakip <tspan fill="#818cf8" font-size="12" font-weight="600">PRO</tspan></text>
    <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">4857 İş Kanunu Uyumlu Fazla Mesai ve Hakediş Sistemi</text>

    <!-- Nav Pills -->
    <g transform="translate(520, 4)">
      <rect x="0" y="0" width="90" height="30" rx="8" fill="#4f46e5" />
      <text x="45" y="19" font-family="sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Genel Bakış</text>

