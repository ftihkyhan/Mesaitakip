      <rect x="250" y="10" width="130" height="22" rx="4" fill="#312e81" fill-opacity="0.4" stroke="#6366f1" stroke-width="0.5" />
      <text x="315" y="25" font-family="sans-serif" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">Hafta İçi Mesai (1.5x)</text>
