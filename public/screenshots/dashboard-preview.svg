  <!-- Right Panel: Quick Add &amp; Legal Notice -->
  <g transform="translate(784, 328)">
    <rect x="0" y="0" width="352" height="295" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <text x="24" y="32" font-family="sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Hızlı İşlemler</text>

    <!-- Quick Add Button -->
    <rect x="20" y="52" width="312" height="44" rx="8" fill="url(#primary-grad)" />
    <text x="176" y="79" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">+ Yeni Fazla Mesai Ekle</text>

    <!-- Quick Live Timer Button -->
