    <text x="52" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Canlı Mesai Takibi Devam Ediyor</text>
    <text x="52" y="38" font-family="sans-serif" font-size="11" fill="#c7d2fe">Başlangıç: 17:30 • Geçen Süre: 01:45:20 • Tahmini Ek Gelir: +₺472.50 (1.5x Normal Mesai)</text>
    <rect x="940" y="10" width="112" height="28" rx="6" fill="#ef4444" />
